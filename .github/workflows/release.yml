name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0)"
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Strip leading "v" from tag name
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build self-contained exe
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.value }}

      - name: Pack NuGet
        run: dotnet pack -c Release -p:Version=${{ steps.version.outputs.value }}

      - name: Create GitHub Release and upload exe
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          files: bin/Release/net10.0-windows/win-x64/publish/HighlightOnCopy.exe
          generate_release_notes: true

      - name: Push to NuGet.org
        run: >
          dotnet nuget push
          bin/Release/HighlightOnCopy.${{ steps.version.outputs.value }}.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
